services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: sdek_client_dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - server
    restart: on-failure