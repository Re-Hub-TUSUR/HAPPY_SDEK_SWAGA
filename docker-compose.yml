# docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    container_name: sdek_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    restart: unless-stopped

  server:
    build: ./server
    container_name: sdek_server
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      FLASK_APP: run.py
      FLASK_DEBUG: 1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data: