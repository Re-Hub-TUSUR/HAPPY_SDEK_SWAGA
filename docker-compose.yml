services:
  db:
    image: postgres:15-alpine
    container_name: sdek_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: unless-stopped

  server:
    build: ./server
    container_name: sdek_server
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      FLASK_APP: run.py
      FLASK_DEBUG: 1
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    depends_on:
      - db
    restart: on-failure

  client:
    build: ./client
    container_name: sdek_client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: on-failure

volumes:
  postgres_data: